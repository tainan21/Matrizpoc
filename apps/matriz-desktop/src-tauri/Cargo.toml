[package]
name = "matriz-control"
version = "1.1.0"
description = "Native Windows utility for the Matriz ecosystem"
edition = "2021"

[lib]
name = "matriz_desktop_native"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
# 0.9.0 unconditionally enables PSEUDOCONSOLE_INHERIT_CURSOR on Windows,
# which can deadlock GUI hosts that do not proxy the cursor-position handshake.
# Keep 0.8.1 until upstream exposes the flag as a stable option.
portable-pty = "=0.8.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sysinfo = { version = "=0.38.3", default-features = false, features = ["component", "disk", "system"] }
trash = "5.2.3"
tauri = { version = "2.11.5", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
uuid = { version = "1.18.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Power",
] }
tauri-plugin-updater = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.23.0"
