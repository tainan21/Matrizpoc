            - textbox [ref=e193]: "# Manual operacional O ponto de entrada obrigatório está em: `apps/matriz-workbench/docs/agent-handbook/README.md` O manual explica: - contexto e linguagem do produto; - score 0–100 e a expressão 1/99; - diferença entre roadmap, backlog, activity e evidência; - protocolo de trabalho antes, durante e depois de uma mudança; - Codex, MCP, skills, plugins e personas; - coworking humano–Codex e uso opcional de multiagentes; - liberdade, boundaries e segurança; - exemplos de respostas corretas e anti-patterns. ## Regra central Uma mudança pode ser registrada sem alterar o score. Um ponto só muda para 1 quando existe outcome observável e evidência revisável. Segurança e contratos não são enfraquecidos silenciosamente para facilitar testes."