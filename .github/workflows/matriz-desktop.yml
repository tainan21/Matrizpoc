name: matriz-desktop

on:
  pull_request:
    paths:
      - "apps/matriz-desktop/**"
      - "apps/seumei/desktop/**"
      - "apps/seumei/src/lib/container*"
      - "apps/seumei/src/ui/presenters/desktop.presenter*"
      - "packages/design/**"
      - "packages/foundation/**"
      - "packages/integration/**"
      - ".github/workflows/matriz-desktop.yml"
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/matriz-desktop/src-tauri
            apps/seumei/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @matriz/app-matriz-desktop test
      - run: pnpm --filter @matriz/app-matriz-desktop typecheck
      - run: pnpm --filter @matriz/app-matriz-desktop lint
      - run: cargo test --manifest-path apps/matriz-desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/matriz-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: pnpm --filter @matriz/app-matriz-desktop package
      - run: pnpm --filter @matriz/app-seumei test
      - run: pnpm --filter @matriz/app-seumei typecheck
      - run: pnpm --filter @matriz/app-seumei lint
      - run: pnpm --filter @matriz/app-seumei package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: matriz-control-windows-x64
          path: apps/matriz-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: seumei-windows-x64
          path: apps/seumei/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
