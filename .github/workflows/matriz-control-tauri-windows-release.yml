name: matriz-control-tauri-windows-release

on:
  push:
    tags: ["control-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @matriz/app-matriz-desktop test
      - run: pnpm --filter @matriz/app-matriz-desktop lint
      - run: pnpm --filter @matriz/app-matriz-desktop typecheck
      - name: Require signing and Hub credentials
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MATRIZ_WINDOWS_SIGNING_CERTIFICATE }}
          MANIFEST_KEY: ${{ secrets.MATRIZ_DISTRIBUTION_MANIFEST_PRIVATE_KEY }}
          HUB_URL: ${{ vars.MATRIZ_DISTRIBUTION_HUB_URL }}
          HUB_TOKEN: ${{ secrets.MATRIZ_DISTRIBUTION_ADMIN_TOKEN }}
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PUBLIC_KEY: ${{ vars.MATRIZ_CONTROL_UPDATER_PUBLIC_KEY }}
          UPDATER_ENDPOINT: ${{ vars.MATRIZ_CONTROL_UPDATER_ENDPOINT }}
          STORE_CATALOG: ${{ vars.MATRIZ_DISTRIBUTION_CATALOG_URL }}
          STORE_PUBLIC_KEY: ${{ vars.MATRIZ_DISTRIBUTION_PUBLIC_KEY }}
        run: |
          foreach ($value in @($env:WINDOWS_CERTIFICATE,$env:MANIFEST_KEY,$env:HUB_URL,$env:HUB_TOKEN,$env:TAURI_KEY,$env:TAURI_PUBLIC_KEY,$env:UPDATER_ENDPOINT,$env:STORE_CATALOG,$env:STORE_PUBLIC_KEY)) { if ([string]::IsNullOrWhiteSpace($value)) { throw "Release trust configuration is required" } }
      - name: Build Authenticode and Tauri-signed artifacts
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MATRIZ_WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MATRIZ_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MATRIZ_CONTROL_UPDATER_ENDPOINT: ${{ vars.MATRIZ_CONTROL_UPDATER_ENDPOINT }}
          MATRIZ_CONTROL_UPDATER_PUBLIC_KEY: ${{ vars.MATRIZ_CONTROL_UPDATER_PUBLIC_KEY }}
          MATRIZ_DISTRIBUTION_CATALOG_URL: ${{ vars.MATRIZ_DISTRIBUTION_CATALOG_URL }}
          MATRIZ_DISTRIBUTION_PUBLIC_KEY: ${{ vars.MATRIZ_DISTRIBUTION_PUBLIC_KEY }}
          MATRIZ_DISTRIBUTION_RELEASE_HOSTS: ${{ vars.MATRIZ_DISTRIBUTION_RELEASE_HOSTS }}
        run: pnpm --filter @matriz/app-matriz-desktop package:update
      - name: Normalize and verify signed artifacts
        id: artifact
        shell: pwsh
        run: |
          $source = Get-ChildItem 'apps/matriz-desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $source) { throw "Installer was not generated" }
          $signature = Get-Item "$($source.FullName).sig" -ErrorAction Stop
          if ($signature.Length -lt 16) { throw "Updater signature was not generated" }
          $version = node -p "require('./apps/matriz-desktop/package.json').version"
          $name = "matriz-control-$version-windows-x64-setup.exe"
          New-Item release-output -ItemType Directory -Force | Out-Null
          Copy-Item $source.FullName "release-output/$name"
          Copy-Item $signature.FullName "release-output/$name.sig"
          if ((Get-AuthenticodeSignature "release-output/$name").Status -ne 'Valid') { throw "Authenticode validation failed" }
          "file=$name" >> $env:GITHUB_OUTPUT
          "signature=$name.sig" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Register signed stable release in Hub
        env:
          MATRIZ_DISTRIBUTION_HUB_URL: ${{ vars.MATRIZ_DISTRIBUTION_HUB_URL }}
          MATRIZ_DISTRIBUTION_ADMIN_TOKEN: ${{ secrets.MATRIZ_DISTRIBUTION_ADMIN_TOKEN }}
          MATRIZ_DISTRIBUTION_MANIFEST_PRIVATE_KEY: ${{ secrets.MATRIZ_DISTRIBUTION_MANIFEST_PRIVATE_KEY }}
        run: corepack pnpm exec tsx tooling/scripts/publish-distribution-release.ts matriz-control-tauri ${{ steps.artifact.outputs.version }} release-output/${{ steps.artifact.outputs.file }} https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.artifact.outputs.file }} release-output/${{ steps.artifact.outputs.signature }} https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.artifact.outputs.file }}
      - uses: softprops/action-gh-release@v2
        with:
          files: release-output/*
