name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + lint + smoke + boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients
        run: pnpm prisma:generate
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm lint
      - name: Smoke
        run: pnpm test:smoke
      - name: Verify app boundaries
        run: pnpm tsx tooling/scripts/verify-app-boundaries.ts
      - name: Readiness score
        run: pnpm tsx tooling/scripts/check-readiness.ts
