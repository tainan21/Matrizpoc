name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux validation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=core
      HUB_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=hub
      SPOT_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=spot
      SEUMEI_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=seumei
      CONTRACTS_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=contracts
      WILLDASH_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=willdash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Validate Prisma schemas
        run: pnpm prisma:validate
      - name: Generate all Prisma clients
        run: pnpm prisma:generate
      - name: Generate Next.js types
        run: pnpm next:typegen
      - name: Run app-local tests
        run: pnpm test:apps
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Smoke
        run: pnpm test:smoke
      - name: Verify app boundaries
        run: pnpm verify:boundaries
      - name: Build affected applications
        if: github.event_name == 'pull_request'
        run: pnpm build:affected
      - name: Build all applications
        if: github.event_name == 'push'
        run: pnpm build
      - name: Readiness score
        run: pnpm tsx tooling/scripts/check-readiness.ts
      - name: Confirm validation did not change tracked files
        run: pnpm check:clean
