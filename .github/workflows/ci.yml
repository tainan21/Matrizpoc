name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux validation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORE_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=core
      HUB_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=hub
      SPOT_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=spot
      SEUMEI_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=seumei
      CONTRACTS_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=contracts
      WILLDASH_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=willdash
      OPS_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=ops
      PAY_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=pay
      SITES_CANONICAL_ORIGINS: https://sites.example.invalid
      MIGRATION_TEST_ZERO_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz_migrations_zero
      MIGRATION_TEST_N_MINUS_ONE_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz_migrations_previous
      CORE_MIGRATION_DATABASE_URL: postgresql://matriz_core_migration:ci-core-migration@127.0.0.1:5432/matriz_migrations_zero?schema=core
      HUB_MIGRATION_DATABASE_URL: postgresql://matriz_hub_migration:ci-hub-migration@127.0.0.1:5432/matriz_migrations_zero?schema=hub
      SPOT_MIGRATION_DATABASE_URL: postgresql://matriz_spot_migration:ci-spot-migration@127.0.0.1:5432/matriz_migrations_zero?schema=spot
      SEUMEI_MIGRATION_DATABASE_URL: postgresql://matriz_seumei_migration:ci-seumei-migration@127.0.0.1:5432/matriz_migrations_zero?schema=seumei
      CONTRACTS_MIGRATION_DATABASE_URL: postgresql://matriz_contracts_migration:ci-contracts-migration@127.0.0.1:5432/matriz_migrations_zero?schema=contracts
      WILLDASH_MIGRATION_DATABASE_URL: postgresql://matriz_willdash_migration:ci-willdash-migration@127.0.0.1:5432/matriz_migrations_zero?schema=willdash
      OPS_MIGRATION_DATABASE_URL: postgresql://matriz_ops_migration:ci-ops-migration@127.0.0.1:5432/matriz_migrations_zero?schema=ops
      PAY_MIGRATION_DATABASE_URL: postgresql://matriz_pay_migration:ci-pay-migration@127.0.0.1:5432/matriz_migrations_zero?schema=pay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject generated artifacts tracked by Git
        run: pnpm verify:tracked-artifacts
      - name: Verify Infrastructure Contracts
        run: pnpm verify:infrastructure
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Create disposable migration databases
        run: |
          PGPASSWORD=prisma createdb -h 127.0.0.1 -U prisma matriz_migrations_zero
          PGPASSWORD=prisma createdb -h 127.0.0.1 -U prisma matriz_migrations_previous
          PGPASSWORD=prisma psql -h 127.0.0.1 -U prisma -d matriz_migrations_zero -f tooling/sql/prepare-ci-runtime-roles.sql
          PGPASSWORD=prisma psql -h 127.0.0.1 -U prisma -d matriz_migrations_previous -f tooling/sql/prepare-ci-runtime-roles.sql
      - name: Run Prisma migration matrix
        run: pnpm prisma:migrate:test
      - name: Verify runtime roles and tenant RLS
        run: |
          PGPASSWORD=prisma psql -h 127.0.0.1 -U prisma -d matriz_migrations_zero -f tooling/sql/verify-tenant-rls.sql
          for app in core hub spot seumei contracts willdash ops pay; do
            role="matriz_${app}_runtime"
            PGPASSWORD="ci-${app}-runtime" psql -h 127.0.0.1 -U "$role" -d matriz_migrations_zero -v expected_role="$role" -f tooling/sql/verify-runtime-login.sql
          done
      - name: Validate Prisma schemas
        run: pnpm prisma:validate
      - name: Generate all Prisma clients
        run: pnpm prisma:generate
      - name: Generate Next.js types
        run: pnpm next:typegen
      - name: Run app-local tests
        run: pnpm test:apps
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Smoke
        run: pnpm test:smoke
      - name: Verify app boundaries
        run: pnpm verify:boundaries
      - name: Build affected applications
        if: github.event_name == 'pull_request'
        run: |
          git branch --force main origin/main
          pnpm build:affected
      - name: Build all applications
        if: github.event_name == 'push'
        run: pnpm build
      - name: Readiness score
        run: pnpm tsx tooling/scripts/check-readiness.ts
      - name: Confirm validation did not change tracked files
        run: pnpm check:clean
