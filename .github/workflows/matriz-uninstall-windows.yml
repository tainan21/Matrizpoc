name: matriz-uninstall-tauri-windows-release
on:
  push:
    tags: ["uninstall-v*"]
  pull_request:
    paths: ["apps/matriz-uninstall/**", "packages/integration/api-contracts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @matriz/app-matriz-uninstall test
      - run: pnpm --filter @matriz/app-matriz-uninstall lint
      - run: pnpm --filter @matriz/app-matriz-uninstall typecheck
      - run: pnpm --filter @matriz/app-matriz-uninstall package:tauri
      - name: Sign, verify and register in Hub
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MATRIZ_WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MATRIZ_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          MATRIZ_DISTRIBUTION_HUB_URL: ${{ vars.MATRIZ_DISTRIBUTION_HUB_URL }}
          MATRIZ_DISTRIBUTION_ADMIN_TOKEN: ${{ secrets.MATRIZ_DISTRIBUTION_ADMIN_TOKEN }}
          MATRIZ_DISTRIBUTION_MANIFEST_PRIVATE_KEY: ${{ secrets.MATRIZ_DISTRIBUTION_MANIFEST_PRIVATE_KEY }}
        run: |
          foreach ($value in @($env:WINDOWS_CERTIFICATE,$env:MATRIZ_DISTRIBUTION_MANIFEST_PRIVATE_KEY,$env:MATRIZ_DISTRIBUTION_HUB_URL,$env:MATRIZ_DISTRIBUTION_ADMIN_TOKEN)) { if ([string]::IsNullOrWhiteSpace($value)) { throw "Release trust configuration is required" } }
          $version = node -p "require('./apps/matriz-uninstall/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "uninstall-v$version") { throw "Tag and version differ" }
          $source = Get-ChildItem 'apps/matriz-uninstall/desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $source) { throw "Installer was not generated" }
          New-Item release-output -ItemType Directory -Force | Out-Null
          $file = "matriz-uninstall-$version-windows-x64-setup.exe"
          Copy-Item $source.FullName "release-output/$file"
          $pfx = Join-Path $env:RUNNER_TEMP 'matriz-signing.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Set-AuthenticodeSignature -FilePath "release-output/$file" -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' | Out-Null
          if ((Get-AuthenticodeSignature "release-output/$file").Status -ne 'Valid') { throw "Authenticode validation failed" }
          node node_modules/tsx/dist/cli.mjs tooling/scripts/publish-distribution-release.ts matriz-uninstall-tauri $version "release-output/$file" "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$file"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "release-output/*" }
