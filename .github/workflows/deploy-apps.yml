name: deploy-apps

# One workflow, one matrix row per app.
# Each app has its own Vercel project + its own Deploy Hook.
# Deploy hooks are the simplest way to deploy from CI without
# pulling the Vercel CLI inside every matrix row.
#
# Required repository secrets (see docs/build-deploy-model.md):
#   VERCEL_DEPLOY_HOOK_MATRIZ_HUB
#   VERCEL_DEPLOY_HOOK_SPOT
#   VERCEL_DEPLOY_HOOK_MATRIZ_ADMIN
#   VERCEL_DEPLOY_HOOK_SEUMEI
#   VERCEL_DEPLOY_HOOK_CONTRACTS
#   VERCEL_DEPLOY_HOOK_WILLDASH

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, matriz-hub, spot, matriz-admin, seumei, contracts, willdash]
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-apps.yml"
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  gate:
    name: pre-deploy gate
    runs-on: ubuntu-latest
    env:
      CORE_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=core
      HUB_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=hub
      SPOT_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=spot
      SEUMEI_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=seumei
      CONTRACTS_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=contracts
      WILLDASH_DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/matriz?schema=willdash
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject generated artifacts tracked by Git
        run: pnpm verify:tracked-artifacts
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Validate Prisma schemas
        run: pnpm prisma:validate
      - name: Generate all Prisma clients
        run: pnpm prisma:generate
      - name: Generate Next.js types
        run: pnpm next:typegen
      - name: Run app-local tests
        run: pnpm test:apps
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Smoke
        run: pnpm test:smoke
      - name: Verify app boundaries
        run: pnpm verify:boundaries
      - name: Build all applications
        run: pnpm build
      - name: Confirm validation did not change tracked files
        run: pnpm check:clean

  deploy:
    name: deploy ${{ matrix.app }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [matriz-hub, spot, matriz-admin, seumei, contracts, willdash]
    steps:
      - name: Select deploy hook for ${{ matrix.app }}
        id: hook
        run: |
          case "${{ matrix.app }}" in
            matriz-hub) echo "url=${{ secrets.VERCEL_DEPLOY_HOOK_MATRIZ_HUB }}" >> "$GITHUB_OUTPUT" ;;
            spot)       echo "url=${{ secrets.VERCEL_DEPLOY_HOOK_SPOT }}"       >> "$GITHUB_OUTPUT" ;;
            matriz-admin) echo "url=${{ secrets.VERCEL_DEPLOY_HOOK_MATRIZ_ADMIN }}" >> "$GITHUB_OUTPUT" ;;
            seumei)     echo "url=${{ secrets.VERCEL_DEPLOY_HOOK_SEUMEI }}"     >> "$GITHUB_OUTPUT" ;;
            contracts)  echo "url=${{ secrets.VERCEL_DEPLOY_HOOK_CONTRACTS }}"  >> "$GITHUB_OUTPUT" ;;
            willdash)   echo "url=${{ secrets.VERCEL_DEPLOY_HOOK_WILLDASH }}"   >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Skip if hook is not configured
        if: steps.hook.outputs.url == ''
        run: |
          echo "::warning::No deploy hook configured for ${{ matrix.app }} — skipping."
      - name: Fire Vercel deploy hook
        if: steps.hook.outputs.url != '' && (inputs.app == 'all' || inputs.app == matrix.app || github.event_name == 'push')
        run: curl -fsSL -X POST "${{ steps.hook.outputs.url }}"
